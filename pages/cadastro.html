<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/cadlog.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
</head>
<body>
    
    <div id="conteiner">
    <a class="auth-brand" href="../index.html">CineBox</a>
    <h1>Cadastro</h1>
    <p class="auth-subtitle">Crie sua conta e compartilhe suas opiniões sobre cinema.</p>
    <form id="cadastroForm">

        <div class="field-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
            <p class="error" id="nomeError"></p>
        </div>

        <div class="field-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
            <p class="error" id="emailError"></p>
        </div>

        <div class="field-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha">
            <p class="error" id="passError"></p>
        </div>

        <div class="field-group">
            <label for="confirmPassword">Confirmar senha</label>
            <input type="password" id="confirmPassword" placeholder="Confirme sua senha">
            <p class="error" id="confirmPassError"></p>
        </div>
    
        <button type="submit">Cadastrar</button>
        <p class="error" id="feedback"></p>
        <p>Já tem uma conta? <a href="../pages/login.html">Faça login</a></p>
    </form>
    </div>
    <script src="../scripts/auth/cadastro.js"></script>
</body>
</html>
