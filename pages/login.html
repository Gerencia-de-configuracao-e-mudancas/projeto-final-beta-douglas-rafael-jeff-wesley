<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadlog.css" type="text/css">
    <title>LOGIN</title>
</head>
<body>
    
    <div id="conteiner">
        <a class="auth-brand" href="../index.html">CineBox</a>
        <h1>Login</h1>
        <p class="auth-subtitle">Entre para continuar explorando seus filmes favoritos.</p>
        <div class="field-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
            <p class="error" id="emailError"></p>
        </div>
        <div class="field-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha">
            <p class="error" id="passError"></p>
        </div>
        <button id="login">Login</button>
        <p>Não tem uma conta? <a href="../pages/cadastro.html">Criar conta</a></p>
        <script src="../scripts/auth/login.js"></script>
        </div>

</body>
</html>
